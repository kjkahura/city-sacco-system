# Test, then deploy the platform to Google Cloud Run, behind Firebase Hosting or, once
# deploy/security/edge.sh has run, behind the load balancer.
# Setup and the settings this reads: platform/docs/deploy.md.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   GCP_PROJECT_ID           the Firebase / Google Cloud project ID
#   GCP_REGION               europe-west1
#   CLOUD_SQL_INSTANCE       PROJECT:REGION:INSTANCE (the instance connection name)
#   WIF_PROVIDER             projects/NUMBER/locations/global/workloadIdentityPools/github/providers/github
#   DEPLOY_SERVICE_ACCOUNT   sacco-deployer@PROJECT.iam.gserviceaccount.com
#   RUNTIME_SERVICE_ACCOUNT  sacco-runtime@PROJECT.iam.gserviceaccount.com
# Optional repository variables (not environment variables: the jobs' `if:` reads them), once
# the load balancer is in place (deploy/security/edge.sh):
#   FRONTEND_BUCKET          the bucket the console and portal are published to.
#   FRONTENDS_ROUTED         yes, once edge.sh routes /console and /portal to that bucket. Then a
#                            push that changes only platform/public or platform/portal, compared
#                            with the commit the running service was built from, publishes the
#                            front ends and leaves the API alone.
#   SITE_URL                 https://your-domain: the address checked after a deploy, in place of
#                            Firebase Hosting, which is then no longer deployed.
#   SERVE_FRONTENDS          off, so the service stops serving /console and /portal itself.
# No keys or passwords are stored in GitHub: the workflow signs in to Google
# through Workload Identity Federation, and the app's secrets are in Secret Manager.

name: Test and deploy

on:
  push:
    branches: [main]
    paths: ['platform/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVICE: sacco-platform
  REPOSITORY: sacco

jobs:
  # What a push changed: the API (anything else under platform/) or only the front ends.
  # Compared with the commit the running service was built from (its image tag), not with the
  # previous push, so an API change from a push that was cancelled or failed is not skipped.
  # Anything uncertain deploys the API.
  scope:
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        if: vars.FRONTENDS_ROUTED == 'yes' && github.event_name == 'push'
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: vars.FRONTENDS_ROUTED == 'yes' && github.event_name == 'push'
      - id: diff
        env:
          ROUTED: ${{ vars.FRONTENDS_ROUTED }}
          REGION: ${{ vars.GCP_REGION }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          api=true
          if [ "$ROUTED" = yes ] && [ "${{ github.event_name }}" = push ]; then
            image=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)
            live=${image##*:}
            if [ -n "$live" ] && git cat-file -e "$live" 2>/dev/null; then
              other=$(git diff --name-only "$live" "$GITHUB_SHA" | grep -Ev '^platform/(public|portal)/' || true)
              [ -z "$other" ] && api=false
            fi
            echo "Running service built from: ${live:-unknown}"
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "API changed: $api"

  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platform
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sacco
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sacco
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      NODE_ENV: test
      SCHEDULER: 'off'
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      # A known vulnerability (high or critical) in a package the service ships stops the deploy,
      # between Dependabot's weekly checks. Development-only packages are not shipped.
      - run: npm audit --omit=dev --audit-level=high
      # The backup tests call pg_dump, which must be at least the server's version (16).
      - run: pg_dump --version
      - run: npm test

  deploy:
    needs: [test, scope]
    if: needs.scope.outputs.api == 'true'
    runs-on: ubuntu-24.04
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
      RUNTIME_SA: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE:$GITHUB_SHA"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" platform
          docker push "$IMAGE"

      # The settings every service and job shares. Secrets come from Secret Manager.
      - name: Settings
        run: |
          echo "ENV_VARS=NODE_ENV=production,PGHOST=/cloudsql/$SQL_INSTANCE,PGUSER=sacco,PGDATABASE=sacco,PGPOOL_MAX=10,SCHEDULER=off,TRUST_PROXY=2" >> "$GITHUB_ENV"
          echo "SECRETS=PGPASSWORD=sacco-db-password:latest,JWT_SECRET=sacco-jwt-secret:latest,SECRETS_KEY=sacco-secrets-key:latest" >> "$GITHUB_ENV"

      - name: Migrate the database
        run: |
          gcloud run jobs deploy sacco-migrate --image "$IMAGE" --region "$REGION" \
            --service-account "$RUNTIME_SA" --set-cloudsql-instances "$SQL_INSTANCE" \
            --set-env-vars "$ENV_VARS" --set-secrets "$SECRETS" \
            --command sh --args="-c,node bin/cli.js migrate:platform && node bin/cli.js migrate:all" \
            --max-retries 0 --task-timeout 30m --quiet
          gcloud run jobs execute sacco-migrate --region "$REGION" --wait

      # With the repository variable APP_DB_USER (deploy/security/db-roles.sql), the service connects as
      # that role, which does not own the tables; migrations and jobs stay with the owner. Sandbox
      # operations then run only in the jobs, which may change schemas (security review, CFG-8).
      - name: Deploy the service
        env:
          APP_DB_USER: ${{ vars.APP_DB_USER }}
          SERVE_FRONTENDS: ${{ vars.SERVE_FRONTENDS }}
        run: |
          SVC_ENV="$ENV_VARS"; SVC_SECRETS="$SECRETS"
          if [ -n "$APP_DB_USER" ]; then
            SVC_ENV="${ENV_VARS/PGUSER=sacco,/PGUSER=$APP_DB_USER,},SANDBOX_AFTER_REQUEST=off"
            SVC_SECRETS="${SECRETS/PGPASSWORD=sacco-db-password/PGPASSWORD=sacco-app-db-password}"
          fi
          if [ -n "$SERVE_FRONTENDS" ]; then SVC_ENV="$SVC_ENV,SERVE_FRONTENDS=$SERVE_FRONTENDS"; fi
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" \
            --service-account "$RUNTIME_SA" --add-cloudsql-instances "$SQL_INSTANCE" \
            --set-env-vars "$SVC_ENV" --set-secrets "$SVC_SECRETS" \
            --allow-unauthenticated --port 8080 --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 1 --concurrency 80 --timeout 60 --quiet

      # Scheduled work runs as jobs; Cloud Scheduler starts them (docs/deploy.md).
      - name: Update the scheduled jobs
        run: |
          for job in "sacco-eod:eod:run" "sacco-tokens:tokens:prune" "sacco-notify:notifications:run"; do
            name="${job%%:*}"; cmd="${job#*:}"
            gcloud run jobs deploy "$name" --image "$IMAGE" --region "$REGION" \
              --service-account "$RUNTIME_SA" --set-cloudsql-instances "$SQL_INSTANCE" \
              --set-env-vars "$ENV_VARS" --set-secrets "$SECRETS" \
              --command node --args="bin/cli.js,$cmd" --max-retries 1 --task-timeout 60m --quiet
          done

      - uses: actions/setup-node@v4
        if: vars.SITE_URL == ''
        with:
          node-version: 22

      # Until the load balancer serves the domain (SITE_URL), Firebase Hosting is the way in.
      - name: Deploy Firebase Hosting
        if: vars.SITE_URL == ''
        working-directory: platform
        run: npx --yes firebase-tools@15.32.1 deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Check the live site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          sleep 10
          curl -fsS "${SITE_URL:-https://$PROJECT_ID.web.app}/health"

  # The console and portal, published to their bucket apart from the API (FRONTEND_BUCKET).
  # index.html is never cached, so a release shows at the next page load; the modules are
  # cached for five minutes, as the service serves them.
  # After the API, so a console that calls a new route is not live before the route is.
  frontends:
    needs: [test, scope, deploy]
    if: always() && vars.FRONTEND_BUCKET != '' && needs.test.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: production
    env:
      BUCKET: ${{ vars.FRONTEND_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Publish the console and portal
        run: |
          for pair in console:platform/public portal:platform/portal; do
            name="${pair%%:*}"; dir="${pair#*:}"
            gcloud storage rsync "$dir" "gs://$BUCKET/$name" --recursive --delete-unmatched-destination-objects \
              --exclude 'index\.html$' --cache-control "public, max-age=300"
            gcloud storage cp "$dir/index.html" "gs://$BUCKET/$name/index.html" --cache-control "no-cache"
          done

      - name: Check the published front ends
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          [ -n "$SITE_URL" ] || { echo "SITE_URL not set: skipped"; exit 0; }
          curl -fsS -o /dev/null "$SITE_URL/console/"
          curl -fsS -o /dev/null "$SITE_URL/portal/"
